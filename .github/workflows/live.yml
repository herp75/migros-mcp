name: Live check with the test account

# Runs scripts/live-account-check.mjs against the real Migros website with the
# dedicated test account: every tool that needs a login, and (by default) the
# basket round trip, which leaves the basket as it was. By hand only, never for
# pull requests: the secrets live in the "live" environment, which only the
# main branch may use. The script prints tool names and counts only.
#
# Not scheduled: in November 2026 Migros answered logins from GitHub's servers
# with Cloudflare's bot check. The weekly run happens on a computer instead
# (scripts/migros-live-check.sh and scripts/systemd/). Start this by hand to
# see whether GitHub's servers get through again.

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Also run the basket round trip (adds and removes one product)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: live-account # one run at a time: the runs share the test account
  cancel-in-progress: false

jobs:
  live:
    name: Tools with an account work
    runs-on: ubuntu-latest
    environment: live
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Live check
        env:
          MIGROS_TEST_EMAIL: ${{ secrets.MIGROS_TEST_EMAIL }}
          MIGROS_TEST_PASSWORD: ${{ secrets.MIGROS_TEST_PASSWORD }}
          MIGROS_TEST_TOTP_SECRET: ${{ secrets.MIGROS_TEST_TOTP_SECRET }}
          MIGROS_LIVE_SESSION_DIR: ${{ runner.temp }}/live-session
          WRITE: ${{ inputs.write }}
        run: |
          if [ "$WRITE" = "true" ]; then npm run live-account -- --write; else npm run live-account; fi
