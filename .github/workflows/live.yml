name: Live check with the test account

# Runs scripts/live-account-check.mjs against the real Migros website with the
# dedicated test account: every tool that needs a login, and (by default) the
# basket round trip, which leaves the basket as it was. Only on a schedule or
# by hand, never for pull requests: the secrets live in the "live"
# environment, which only the main branch may use. The script prints tool
# names and counts only, no personal data.

on:
  schedule:
    - cron: "37 6 * * 1" # Mondays, 06:37 UTC, after the check without an account
  workflow_dispatch:
    inputs:
      write:
        description: "Also run the basket round trip (adds and removes one product)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: live-account # one run at a time: the runs share the test account
  cancel-in-progress: false

jobs:
  live:
    name: Tools with an account work
    runs-on: ubuntu-latest
    environment: live
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # to report a failed scheduled run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Live check
        env:
          MIGROS_TEST_EMAIL: ${{ secrets.MIGROS_TEST_EMAIL }}
          MIGROS_TEST_PASSWORD: ${{ secrets.MIGROS_TEST_PASSWORD }}
          MIGROS_TEST_TOTP_SECRET: ${{ secrets.MIGROS_TEST_TOTP_SECRET }}
          MIGROS_LIVE_SESSION_DIR: ${{ runner.temp }}/live-session
          WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
        run: |
          if [ "$WRITE" = "true" ]; then npm run live-account -- --write; else npm run live-account; fi
      - name: Report a failed run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Live check with the test account failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Only the link: the job log is the place for details
        run: |
          body="The scheduled live check failed: $RUN_URL. A likely cause is a change on the Migros website, or Migros blocking the login from GitHub's servers."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
