name: Release

# Pushing a tag vX.Y.Z releases that version of this fork: full CI and security checks
# first, then the signed Docker image (ghcr.io), the GitHub Release with the changelog
# section, and the MCP Registry entry (io.github.herp75/migros-mcp). No npm package: the
# name migros-mcp belongs to upstream (lewpgs/migros-mcp).

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag, version files and CHANGELOG agree; the tag is on main
        run: |
          fail() { echo "::error::$1"; exit 1; }
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "tag $GITHUB_REF_NAME is not vX.Y.Z"
          [ "$(jq -r .version package.json)" = "$v" ] || fail "package.json does not say $v"
          [ "$(jq -r .version package-lock.json)" = "$v" ] || fail "package-lock.json does not say $v"
          [ "$(jq -r '.packages[""].version' package-lock.json)" = "$v" ] || fail "package-lock.json (packages) does not say $v"
          [ "$(jq -r .version manifest.json)" = "$v" ] || fail "manifest.json does not say $v"
          [ "$(jq -r .version server.json)" = "$v" ] || fail "server.json does not say $v"
          [ "$(jq -r '.packages[0].identifier' server.json)" = "ghcr.io/herp75/migros-mcp:$v" ] || fail "server.json image is not :$v"
          grep -Eq "^## \[$v\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || fail "no CHANGELOG section for $v"
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || fail "the tag is not on main"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    needs: check
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  docker:
    needs: [ci, security]
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  github-release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Changelog section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v head="## [$v]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            cat notes.md
            echo
            echo "## Install"
            echo
            echo "Docker image \`ghcr.io/$GITHUB_REPOSITORY:$v\`, signed with cosign (see README). Also in the MCP Registry as \`io.github.herp75/migros-mcp\`."
          } > body.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file body.md --verify-tag server.json

  mcp-registry:
    needs: [docker, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # log in to the MCP Registry with GitHub OIDC
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install mcp-publisher (signature verified)
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.sigstore.json"
          cosign verify-blob "$archive" --bundle "$archive.sigstore.json" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION"
          tar xzf "$archive" mcp-publisher
      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
