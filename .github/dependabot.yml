version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give a new release two weeks before proposing it (supply-chain attacks
    # are usually found and pulled within days).
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
